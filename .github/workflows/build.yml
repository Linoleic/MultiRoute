name: build

# Branch and pull-request checks. Releases are owned by release.yml, which is triggered by a tag.
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + release APK
    runs-on: ubuntu-latest
    env:
      # Repository secrets with the release keystore. They are absent for pull requests from
      # forks, in which case the build falls back to debug signing (see the signing step).
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version name comes from tags; the version code and the embedded build id from the history.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36'

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Configure release signing
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          # Keep the keystore outside the workspace so it can never be uploaded as an artifact.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/multiroute-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/multiroute-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured from repository secrets."

      - name: Check release signing secrets
        # Report which signing secrets are visible to this run. Only presence and length are shown,
        # never the value; the annotations also make it obvious in the Actions UI why signing was
        # skipped (e.g. a secret added as a variable, or under a different name).
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::notice title=Signing secret::$name is available (${#value} characters)"
            else
              echo "::warning title=Signing secret::$name is MISSING"
              missing=$((missing + 1))
            fi
          done
          echo "Missing signing secrets: $missing"

      - name: Note signing mode
        run: |
          if [ -f keystore.properties ]; then
            echo "Building a signed release APK."
          else
            echo "::warning::No release keystore secret available (fork or PR) - falling back to debug signing."
          fi

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Report version
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          LINE=$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | head -1)
          VERSION=$(echo "$LINE" | grep -oE "versionCode='[0-9]+' versionName='[^']+'" | head -1)
          echo "::notice title=Build version::$VERSION"

      - name: Check update manifest
        # The in-manager update check reads xposed_update.json, so it has to describe the released build.
        # A commit that is ahead of the release is normal (the manifest describes the last release); a
        # build *older* than the manifest, or any mismatch on a tag, would advertise something wrong.
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APK_CODE=$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | head -1 \
            | grep -oE "versionCode='[0-9]+'" | tr -dc '0-9')
          MANIFEST_CODE=$(grep -oE '"versionCode": *[0-9]+' xposed_update.json | tr -dc '0-9')
          echo "build=$APK_CODE manifest=$MANIFEST_CODE"
          if [ "$APK_CODE" = "$MANIFEST_CODE" ]; then
            echo "::notice title=Update manifest::xposed_update.json matches this build (versionCode $APK_CODE)"
          elif [ "$APK_CODE" -gt "$MANIFEST_CODE" ]; then
            echo "::notice title=Update manifest::this commit is past the published release; xposed_update.json still describes $MANIFEST_CODE"
          else
            echo "::error title=Update manifest::this build ($APK_CODE) is OLDER than xposed_update.json ($MANIFEST_CODE), which would advertise a build that does not exist"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$APK_CODE" != "$MANIFEST_CODE" ]; then
            echo "::error title=Update manifest::tag ${GITHUB_REF_NAME:-} is not the release xposed_update.json describes ($MANIFEST_CODE vs $APK_CODE)"
            exit 1
          fi

      - name: Verify release signing
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          # Fail loudly if the APK somehow ended up debug-signed instead of signed by the release
          # keystore: compare the APK's signer digest with the certificate inside the keystore.
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" | awk '/SHA-256 digest/{print $NF; exit}' | tr 'A-Z' 'a-z')
          # The digest is the last whitespace-separated field ("SHA256: 17:BA:..."), so take $NF and
          # strip the separators - a greedy `sed 's/.*: *//'` would leave only the final byte.
          KS_SHA=$("$JAVA_HOME/bin/keytool" -list -v -keystore "$RUNNER_TEMP/multiroute-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -iE 'SHA-?256:' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "APK signer certificate SHA-256 : $APK_SHA"
          echo "Keystore certificate SHA-256    : $KS_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error title=Signing mismatch::APK signer=$APK_SHA keystore=$KS_SHA"
            exit 1
          fi
          echo "Release APK is signed by the release keystore."

      - name: Report signer certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'certificate DN|SHA-256 digest' || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MultiRoute-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
